<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="PHENO-OA logo">
  <title>PHENO-OA logo (3D tile, new: no O-A bar)</title>
  <defs>
    <clipPath id="disc"><circle cx="512" cy="512" r="512"/></clipPath>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72B0B4"/><stop offset="0.22" stop-color="#4F8D90"/><stop offset="0.55" stop-color="#34686B"/><stop offset="1" stop-color="#17434A"/></linearGradient>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="48" x2="0" y2="976"><stop offset="0" stop-color="#6AAFB0"/><stop offset="0.3" stop-color="#60A9AB"/><stop offset="0.56" stop-color="#4D8E91"/><stop offset="0.78" stop-color="#2F6468"/><stop offset="1" stop-color="#28595E"/></linearGradient>
    <radialGradient id="glow-bg" gradientUnits="userSpaceOnUse" cx="480" cy="310" r="360">
      <stop offset="0" stop-color="#9BE6E4" stop-opacity="0.38"/><stop offset=".5" stop-color="#9BE6E4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9BE6E4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="480" cy="420" r="560" gradientTransform="translate(480 420) scale(1 1.25) translate(-480 -420)">
      <stop offset=".35" stop-color="#0E3236" stop-opacity="0"/><stop offset="1" stop-color="#0E3236" stop-opacity="0.56"/>
    </radialGradient>
    <pattern id="grid" width="7.33" height="7.33" patternUnits="userSpaceOnUse">
      <path d="M0 .5H7.33M.5 0V7.33" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" fill="none"/>
    </pattern>
    <radialGradient id="grid-fade" gradientUnits="userSpaceOnUse" cx="512" cy="470" r="520">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".75" stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask"><rect width="1024" height="1024" fill="url(#grid-fade)"/></mask>
    <clipPath id="inner"><rect x="47" y="50" width="930" height="926" rx="198"/></clipPath>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/><stop offset=".25" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    

    <linearGradient id="satin" gradientUnits="userSpaceOnUse" x1="120" y1="300" x2="520" y2="720">
      <stop offset="0" stop-color="#F6F7FA"/><stop offset=".5" stop-color="#EDEEF2"/><stop offset="1" stop-color="#E5E7EC"/>
    </linearGradient>
    <linearGradient id="side" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="725">
      <stop offset="0" stop-color="#7E9499"/><stop offset=".5" stop-color="#A9B9BE"/><stop offset="1" stop-color="#C3CFD3"/>
    </linearGradient>
    <linearGradient id="bevel-out" gradientUnits="userSpaceOnUse" x1="150" y1="330" x2="480" y2="700">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".3"/>
      <stop offset=".6" stop-color="#B8C5CA" stop-opacity=".3"/><stop offset="1" stop-color="#AEBCC1"/>
    </linearGradient>
    <linearGradient id="bevel-in" gradientUnits="userSpaceOnUse" x1="200" y1="390" x2="430" y2="640">
      <stop offset="0" stop-color="#A9B8BD"/><stop offset=".5" stop-color="#C8D2D6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bar-fill" gradientUnits="userSpaceOnUse" x1="0" y1="489.5" x2="0" y2="536.5">
      <stop offset="0" stop-color="#C6D2D6"/><stop offset=".06" stop-color="#F3F7F8"/><stop offset=".12" stop-color="#FFFFFF"/>
      <stop offset=".19" stop-color="#F3F6F8"/><stop offset=".5" stop-color="#E8EEF0"/><stop offset=".8" stop-color="#DBE3E6"/>
      <stop offset=".87" stop-color="#C3CFD3"/><stop offset=".95" stop-color="#A3B4B9"/><stop offset="1" stop-color="#B1BFC3"/>
    </linearGradient>
    <linearGradient id="leg-l" gradientUnits="userSpaceOnUse" x1="607.38" y1="501.61" x2="645.62" y2="516.39"><stop offset="0" stop-color="#C9D4D8"/><stop offset="0.06" stop-color="#F3F6F8"/><stop offset="0.12" stop-color="#FFFFFF"/><stop offset="0.19" stop-color="#F4F7F9"/><stop offset="0.5" stop-color="#EAEFF2"/><stop offset="0.8" stop-color="#DEE5E8"/><stop offset="0.87" stop-color="#C6D1D5"/><stop offset="0.95" stop-color="#A7B7BC"/><stop offset="1" stop-color="#B4C1C5"/></linearGradient>
    <linearGradient id="leg-r" gradientUnits="userSpaceOnUse" x1="726.43" y1="513.52" x2="764.57" y2="498.48"><stop offset="0" stop-color="#C9D4D8"/><stop offset="0.06" stop-color="#F3F6F8"/><stop offset="0.12" stop-color="#FFFFFF"/><stop offset="0.19" stop-color="#F4F7F9"/><stop offset="0.5" stop-color="#EAEFF2"/><stop offset="0.8" stop-color="#DEE5E8"/><stop offset="0.87" stop-color="#C6D1D5"/><stop offset="0.95" stop-color="#A7B7BC"/><stop offset="1" stop-color="#B4C1C5"/></linearGradient>
    <radialGradient id="pearl" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".3" stop-color="#F7F8FB"/>
      <stop offset=".58" stop-color="#DDE3E7"/><stop offset=".84" stop-color="#B3C1C5"/><stop offset="1" stop-color="#97A9AD"/>
    </radialGradient>
    <radialGradient id="pearl-rim" cx=".42" cy=".4" r=".62">
      <stop offset=".78" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#E9F4F4" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="glass-body" cx=".46" cy=".5" r=".52">
      <stop offset="0" stop-color="#D3ECEA" stop-opacity=".46"/><stop offset=".6" stop-color="#DDF2F0" stop-opacity=".58"/>
      <stop offset=".88" stop-color="#EEFAF9" stop-opacity=".72"/><stop offset="1" stop-color="#F6FFFE" stop-opacity=".82"/>
    </radialGradient>
    <radialGradient id="glass-rim" cx=".38" cy=".3" r=".7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="front-apex"><rect x="486" y="362" width="400" height="200" transform="rotate(-21 686 362)"/></clipPath><clipPath id="front-foot"><rect x="370" y="670" width="400" height="200" transform="rotate(-25 570 670)"/></clipPath>
    <mask id="no-glass" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="686" cy="355" r="56"/><circle cx="567" cy="663" r="56"/>
    </mask>
    <linearGradient id="leg-r-shade" gradientUnits="userSpaceOnUse" x1="686" y1="355" x2="805" y2="657">
      <stop offset=".1" stop-color="#7F979C" stop-opacity=".42"/><stop offset=".5" stop-color="#7F979C" stop-opacity=".12"/>
      <stop offset=".8" stop-color="#7F979C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ring-clip"><path d="M111 512A202 207 0 1 1 515 512A202 207 0 1 1 111 512ZM174 512A139 144.5 0 1 1 452 512A139 144.5 0 1 1 174 512Z" clip-rule="evenodd"/></clipPath>
    <clipPath id="hole-clip"><path d="M174 512A139 144.5 0 1 1 452 512A139 144.5 0 1 1 174 512Z"/></clipPath>

    <filter id="drop" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11"/><feOffset dx="7" dy="13"/>
      <feFlood flood-color="#08272B" flood-opacity=".62"/><feComposite operator="in" in2="SourceGraphic"/>
      <feComposite operator="in"/>
    </filter>
    <filter id="bar-drop" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="streak" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="contact" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="halo" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- disc: the tile's face, round, with a faint rim -->
  <g clip-path="url(#disc)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow-bg)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>
    <rect width="1024" height="1024" fill="url(#grid)" mask="url(#grid-mask)"/>
  </g>
  <circle cx="512" cy="512" r="506" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="12"/>
</svg>
